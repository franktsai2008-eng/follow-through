<text x="52" y="106" fill="#f2f2f2" font-size="30" font-weight="600" letter-spacing="-0.01em">Follow-Through · how a case works</text>
<text x="52" y="136" fill="#8c8c8c" font-size="14">After the meeting: agree the strategy, edit the draft, it learns from your edits.</text>

