<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="howitruns-title howitruns-desc" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="howitruns-title">Follow-Through · how a case works</title>
<desc id="howitruns-desc">A seven-step flow for one meeting: the meeting notes go in; the agent digests them into decisions, commitments, open items and risks, with public context from the You.com Search API; a CrewAI crew proposes three approaches and you settle on one in a short chat; the agent drafts the follow-up email from the locked strategy and recalled lessons; you edit it and press Send, and One sends it through Gmail; every place you touched becomes a lesson in One memory, recalled on the next case; and a dashed harness box under the last two steps replays how much you had to change, case after case, in a Daytona sandbox.</desc>
<defs>
