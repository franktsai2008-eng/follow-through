<text x="52" y="800" fill="#8c8c8c" font-size="13">Learning target: you edit less over time; the agent gets more explicit about your limits, not more willing to concede.</text>
<text x="52" y="826" fill="#8c8c8c" font-size="13">Lessons live in lessons.md and One memory. No keys or mailbox token in the repo.</text>
